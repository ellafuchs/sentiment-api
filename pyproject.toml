[project]
name = "poc-bert"
version = "0.1.0"
description = "BERT sentiment analysis service with a gated deployment pipeline"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "transformers>=4.46",
    "torch>=2.5",
    "huggingface-hub>=0.26",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "datasets>=3.0",
]

# ---------------------------------------------------------------------------
# On Linux (i.e. the Docker build) pull torch from PyTorch's CPU-only index.
# The default PyPI wheel bundles CUDA and would add ~2.5GB to the image for
# GPU support we will never use. On macOS the default wheel is already CPU.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "container: tests that require a running container (deselect with '-m \"not container\"')",
    "model: tests that load the real model weights — slow, needs `make fetch`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
