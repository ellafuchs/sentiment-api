# =============================================================================
# Continuous deployment.
#
# Push to main -> build -> deploy serving nothing -> smoke test it -> 10% canary
# -> 100%.
#
# The shape is the point. A pipeline that builds and immediately serves has one
# decision in it; this has three, and each one can say no:
#
#   deploy    the revision exists and answers, on production hardware, at its
#             own private URL, with zero users on it
#   smoke     pytest -m deploy against that URL — including the check that the
#             thing answering is the image this commit built
#   release   a tenth of traffic, watched, before all of it
#
# A bad revision caught at step 2 was seen by nobody. Caught at step 3, by a
# tenth of callers for sixty seconds. The old revision is still there and still
# warm the whole time, which is why `make rollback` takes seconds.
#
# This runs the SAME `make push` and `infra/deploy.sh` you run by hand. That is
# deliberate and it is the whole design: a pipeline that reimplements the deploy
# in YAML is a second implementation that drifts from the first, and you find
# out which one was wrong during an incident. The flags live in deploy.sh; this
# file only decides *when* deploy.sh runs.
#
# No service-account key is stored anywhere. GitHub mints a short-lived OIDC
# token describing this workflow, and Google exchanges it for an access token
# that expires in an hour. `infra/setup.sh` configured the trust, restricted to
# this repository on this branch.
# =============================================================================
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, and `id-token: write` is the one that matters — it is what
# lets the job request an OIDC token. Note `contents: read`: this workflow has
# no business writing to the repo.
permissions:
  contents: read
  id-token: write

# Deploys must not overlap. Two concurrent runs would race to set traffic and
# the loser would silently win. `cancel-in-progress: false` because cancelling
# a deploy halfway leaves the service in whatever state it had reached.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. `git rev-parse --short`
          # picks the shortest unambiguous length for the objects it can see, so
          # a shallow clone can abbreviate the same commit differently than your
          # laptop does — and that string is the image tag.
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authorise Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # uv is needed before the build now, not after: `make push` scores the
      # image on the way through, and scoring runs eval/run_eval.py.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The runner is amd64, so the `--platform linux/amd64` inside `build-amd64`
      # is a no-op here. It is not redundant: it is what makes the arm64 laptop
      # produce the same artifact as this runner.
      #
      # `make push` is build -> score -> bake the report in -> push. The image
      # that reaches Cloud Run therefore knows what it scored and serves it at
      # /metadata, which is the baseline ci.yml compares the next candidate
      # against. Deploying an unevaluated image would leave that check with
      # nothing to compare to, and a regression check that never runs is
      # indistinguishable from one that always passes.
      - name: Build, score and push
        run: make push
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}

      # Creates the revision with --no-traffic --tag=candidate and waits for its
      # /readyz. Nothing is serving it yet. Emits revision / candidate_url /
      # previous to $GITHUB_OUTPUT.
      - name: Deploy (no traffic)
        id: deploy
        run: infra/deploy.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.GCP_AR_REPO }}
          SERVICE: ${{ vars.GCP_SERVICE }}
          SA_EMAIL: ${{ vars.GCP_RUNTIME_SA }}

      - name: Smoke test the candidate
        run: make smoke
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.candidate_url }}

      - name: Release (canary, then all)
        run: infra/release.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_SERVICE }}
          REVISION: ${{ steps.deploy.outputs.revision }}

      # `always()` so a failed canary still reports which revision is serving —
      # which, after a rollback, is not the one this run built. That is exactly
      # the moment you want the summary to be accurate.
      - name: Summary
        if: always()
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_SERVICE }}
        run: |
          # Through lib.sh, like every other caller. This was the fourth copy of
          # that query and the one that outlived the fix: `describe` takes
          # --flatten but rejects --filter, so the inlined version errored on
          # every run — including the runs where this summary is the only place
          # that says which revision a rollback left serving. And because the
          # exit status of `cmd | head -1` is head's, it reported success while
          # producing an empty answer. A silently blank summary is worse than a
          # failed one.
          source infra/lib.sh
          SERVING="$(serving_revision)"
          URL="$(describe --format='value(status.url)')"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| built | \`${{ steps.deploy.outputs.revision }}\` |"
            echo "| **serving** | \`${SERVING}\` |"
            echo "| previous | \`${{ steps.deploy.outputs.previous }}\` |"
            echo "| url | ${URL} |"
            if [ "${SERVING}" != "${{ steps.deploy.outputs.revision }}" ]; then
              echo ""
              echo "> This run did **not** release. \`${SERVING}\` is still serving."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
